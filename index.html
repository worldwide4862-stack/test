<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 저녁 메뉴 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍽️ 오늘 저녁 뭐 먹지?</h1>
      <p>결정 장애를 위한 랜덤 저녁 메뉴 추천기!</p>
    </header>

    <main>
      <!-- 메뉴 표시 영역 -->
      <div class="display-card">
        <div id="emoji-display" class="emoji">❓</div>
        <div id="menu-display" class="menu-name">버튼을 눌러보세요!</div>
        <div id="desc-display" class="menu-desc">오늘의 완벽한 저녁 메뉴를 골라드립니다.</div>
      </div>

      <!-- 메인 추천 버튼 -->
      <button id="recommend-btn" class="primary-btn">
        ✨ 저녁 메뉴 추천받기 ✨
      </button>

      <!-- 결과 확인 후 추가 기능 (기본 숨김) -->
      <div id="action-buttons" class="action-group hidden">
        <button id="retry-btn" class="secondary-btn">🔄 다시 뽑기</button>
        <a id="search-link" href="#" target="_blank" class="search-btn">🔍 주변 맛집 검색</a>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
