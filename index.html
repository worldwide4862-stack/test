<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초보자의 모험</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#gameWrap{position:relative;width:min(100vw,1100px)}canvas{display:block;width:100%;height:auto;background:#87ceeb;border:4px solid #111827;image-rendering:pixelated}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:8px;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="gameWrap"><canvas id="game" width="1100" height="650"></canvas><div id="help">← → 이동　SPACE 점프　Z 공격　X 물약</div></div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;
const keys={};let cameraX=0,gameOver=false,victory=false;
window.addEventListener("keydown",e=>{keys[e.code]=true;if(["ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();if(e.code==="KeyZ")attack();if(e.code==="KeyX")usePotion();if(gameOver&&e.code==="Enter")resetGame()});
window.addEventListener("keyup",e=>keys[e.code]=false);
const gravity=.7;
const player={x:250,y:400,w:38,h:58,vx:0,vy:0,speed:5,jump:14,hp:100,maxHp:100,mp:50,maxMp:50,level:1,exp:0,nextExp:100,gold:0,potions:5,facing:1,attacking:false,attackTimer:0,grounded:false,invincible:0};
const platforms=[
{x:-500,y:570,w:1600,h:100},{x:1200,y:570,w:1200,h:100},{x:400,y:460,w:220,h:30},
{x:750,y:390,w:220,h:30},{x:1050,y:480,w:180,h:30},{x:1450,y:450,w:220,h:30},
{x:1800,y:350,w:220,h:30},{x:2150,y:450,w:220,h:30}];
function createMonster(x,y,type,hp,exp){return{x,y,w:44,h:42,vx:0,vy:0,type,hp,maxHp:hp,exp,alive:true,attackCooldown:0,hitFlash:0}}
const monsters=[
createMonster(600,510,"슬라임",35,15),createMonster(850,330,"슬라임",40,20),createMonster(1120,430,"버섯",50,25),
createMonster(1500,400,"버섯",55,30),createMonster(1850,290,"고블린",70,40),createMonster(2200,400,"고블린",80,50)];
const particles=[],floatingTexts=[];
function spawnParticle(x,y,color){particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:25,color})}
function textPop(x,y,text,color="#fff"){floatingTexts.push({x,y,text,color,life:45})}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function updatePlayer(){
 if(gameOver||victory)return;
 if(keys.ArrowLeft){player.vx=-player.speed;player.facing=-1}else if(keys.ArrowRight){player.vx=player.speed;player.facing=1}else player.vx*=.75;
 if(keys.Space&&player.grounded){player.vy=-player.jump;player.grounded=false;keys.Space=false}
 player.vy+=gravity;player.x+=player.vx;player.y+=player.vy;player.grounded=false;
 for(const p of platforms)if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+25&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.grounded=true}
 if(player.y>H+200)player.hp=0;
 if(player.invincible>0)player.invincible--;
 if(player.attackTimer>0)player.attackTimer--;else player.attacking=false;
 cameraX+=(player.x-cameraX-350)*.08;cameraX=Math.max(0,Math.min(cameraX,1450));
}
function attack(){
 if(gameOver||victory||player.attackTimer>0)return;
 player.attacking=true;player.attackTimer=25;
 const hit={x:player.facing===1?player.x+player.w:player.x-70,y:player.y+10,w:70,h:40};
 let hitSomething=false;
 for(const m of monsters){if(!m.alive)continue;if(rectsOverlap(hit,m)){
  const damage=Math.floor(15+player.level*7+Math.random()*10);m.hp-=damage;m.hitFlash=8;
  textPop(m.x,m.y-15,"-"+damage,"#ffeb3b");for(let i=0;i<8;i++)spawnParticle(m.x+m.w/2,m.y+m.h/2,"#fff");
  hitSomething=true;if(m.hp<=0)killMonster(m);
 }}
 if(!hitSomething)for(let i=0;i<4;i++)spawnParticle(player.x+player.w/2+player.facing*40,player.y+30,"#ffe082");
}
function killMonster(m){
 m.alive=false;player.exp+=m.exp;player.gold+=Math.floor(10+Math.random()*30);textPop(m.x,m.y-30,"+"+m.exp+" EXP","#7cff8a");
 for(let i=0;i<15;i++)spawnParticle(m.x+m.w/2,m.y+m.h/2,"#9cdbff");checkLevelUp();
 if(monsters.every(m=>!m.alive))victory=true;
}
function checkLevelUp(){
 while(player.exp>=player.nextExp){player.exp-=player.nextExp;player.level++;player.nextExp=Math.floor(player.nextExp*1.35);
 player.maxHp+=25;player.hp=player.maxHp;player.maxMp+=10;player.mp=player.maxMp;textPop(player.x,player.y-40,"LEVEL UP!","#ffe600");
 for(let i=0;i<25;i++)spawnParticle(player.x+player.w/2,player.y+player.h/2,"#ffd54f")}
}
function usePotion(){if(player.potions<=0||player.hp>=player.maxHp)return;player.potions--;player.hp=Math.min(player.maxHp,player.hp+50);textPop(player.x,player.y-20,"+50 HP","#ff6b6b")}
function updateMonsters(){
 if(gameOver||victory)return;
 for(const m of monsters){if(!m.alive)continue;if(m.hitFlash>0)m.hitFlash--;const d=player.x-m.x;
  if(Math.abs(d)<350)m.vx=d>0?1.1:-1.1;else m.vx*=.8;m.vy+=gravity;m.x+=m.vx;m.y+=m.vy;
  for(const p of platforms)if(m.x+m.w>p.x&&m.x<p.x+p.w&&m.y+m.h>=p.y&&m.y+m.h<=p.y+25&&m.vy>=0){m.y=p.y-m.h;m.vy=0}
  if(m.attackCooldown>0)m.attackCooldown--;
  if(rectsOverlap(player,m)&&m.attackCooldown<=0&&player.invincible<=0){const damage=8+Math.floor(m.maxHp/25);player.hp-=damage;player.invincible=45;m.attackCooldown=60;textPop(player.x,player.y-20,"-"+damage,"#ff5252");player.vy=-5}
 }
 if(player.hp<=0)gameOver=true;
}
function updateEffects(){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;if(p.life<=0)particles.splice(i,1)}
 for(let i=floatingTexts.length-1;i>=0;i--){const t=floatingTexts[i];t.y-=.7;t.life--;if(t.life<=0)floatingTexts.splice(i,1)}
}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#75c9ff");g.addColorStop(1,"#d9f3ff");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.8)";
 for(let i=0;i<8;i++){const x=((i*230-cameraX*.2)%1300)-100,y=70+(i%3)*65;ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.arc(x+30,y-10,35,0,Math.PI*2);ctx.arc(x+65,y,25,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle="#9cc9a0";for(let i=0;i<10;i++){const x=i*180-(cameraX*.35%180);ctx.beginPath();ctx.moveTo(x-120,570);ctx.lineTo(x,300);ctx.lineTo(x+150,570);ctx.fill()}
 for(let i=0;i<15;i++){const x=i*180-cameraX*.55;ctx.fillStyle="#795548";ctx.fillRect(x,430,22,140);ctx.fillStyle="#4caf50";ctx.beginPath();ctx.arc(x+10,410,55,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-20,435,35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+40,435,35,0,Math.PI*2);ctx.fill()}
}
function drawPlatforms(){for(const p of platforms){const x=p.x-cameraX;ctx.fillStyle="#76502c";ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle="#4caf50";ctx.fillRect(x,p.y,p.w,12);ctx.fillStyle="#8bc34a";ctx.fillRect(x,p.y,p.w,4)}}
function drawPlayer(){
 const x=player.x-cameraX,y=player.y;if(player.invincible>0&&Math.floor(player.invincible/4)%2===0)return;
 ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(x+19,y+59,25,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#303f9f";ctx.fillRect(x+5,y+38,11,20);ctx.fillRect(x+23,y+38,11,20);ctx.fillStyle="#e53935";ctx.fillRect(x+4,y+18,30,25);
 ctx.fillStyle="#ffd1a9";ctx.fillRect(x+7,y+2,25,22);ctx.fillStyle="#5d4037";ctx.fillRect(x+6,y,27,8);
 ctx.fillStyle="#111";const eyeX=player.facing===1?x+25:x+10;ctx.fillRect(eyeX,y+10,4,4);
 ctx.save();ctx.translate(x+19,y+31);ctx.scale(player.facing,1);ctx.rotate(player.attacking?-.5:.7);ctx.fillStyle="#ddd";ctx.fillRect(8,-4,player.attacking?65:45,8);ctx.fillStyle="#ffc107";ctx.fillRect(2,-7,10,14);ctx.restore();
}
function drawMonster(m){
 if(!m.alive)return;const x=m.x-cameraX,y=m.y;if(m.hitFlash>0)ctx.globalAlpha=.5;
 if(m.type==="슬라임"){ctx.fillStyle="#62d6ff";ctx.beginPath();ctx.arc(x+22,y+25,22,Math.PI,0);ctx.lineTo(x+44,y+38);ctx.lineTo(x,y+38);ctx.closePath();ctx.fill();ctx.fillStyle="#222";ctx.fillRect(x+12,y+22,4,5);ctx.fillRect(x+28,y+22,4,5)}
 if(m.type==="버섯"){ctx.fillStyle="#ff7043";ctx.beginPath();ctx.arc(x+22,y+17,24,Math.PI,0);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+13,y+10,5,0,Math.PI*2);ctx.arc(x+29,y+8,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd1a9";ctx.fillRect(x+10,y+18,24,20)}
 if(m.type==="고블린"){ctx.fillStyle="#66bb6a";ctx.fillRect(x+6,y+8,32,32);ctx.fillStyle="#388e3c";ctx.beginPath();ctx.moveTo(x+6,y+13);ctx.lineTo(x-3,y+3);ctx.lineTo(x+10,y+8);ctx.fill();ctx.beginPath();ctx.moveTo(x+38,y+13);ctx.lineTo(x+47,y+3);ctx.lineTo(x+34,y+8);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(x+13,y+20,5,5);ctx.fillRect(x+27,y+20,5,5)}
 ctx.globalAlpha=1;const ratio=Math.max(0,m.hp/m.maxHp);ctx.fillStyle="#222";ctx.fillRect(x-3,y-12,56,7);ctx.fillStyle="#ef5350";ctx.fillRect(x,y-10,50*ratio,3)
}
function drawEffects(){
 for(const p of particles){ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,5,5)}ctx.globalAlpha=1;
 for(const t of floatingTexts){ctx.globalAlpha=t.life/45;ctx.font="bold 18px Arial";ctx.fillStyle=t.color;ctx.textAlign="center";ctx.fillText(t.text,t.x-cameraX,t.y)}
 ctx.globalAlpha=1;ctx.textAlign="left";
}
function drawUI(){
 ctx.fillStyle="rgba(20,20,35,.82)";ctx.fillRect(15,15,350,105);ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("초보자의 모험",30,40);
 ctx.font="14px Arial";ctx.fillText(`Lv.${player.level}   골드: ${player.gold}   물약: ${player.potions}`,30,62);
 ctx.fillStyle="#333";ctx.fillRect(30,72,180,14);ctx.fillStyle="#ef5350";ctx.fillRect(30,72,180*(player.hp/player.maxHp),14);ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(`${Math.max(0,player.hp)} / ${player.maxHp}`,90,83);
 ctx.fillStyle="#333";ctx.fillRect(220,72,125,14);ctx.fillStyle="#7e57c2";ctx.fillRect(220,72,125*(player.exp/player.nextExp),14);ctx.fillStyle="#fff";ctx.fillText("EXP",270,83);
}
function drawGoal(){const x=2280-cameraX;ctx.fillStyle="#6d4c41";ctx.fillRect(x,380,90,190);ctx.fillStyle="#ffca28";ctx.fillRect(x+20,400,50,40);ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.fillText("BOSS",x+20,425)}
function drawOverlay(){
 if(!gameOver&&!victory)return;ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
 if(victory){ctx.fillStyle="#ffe082";ctx.font="bold 52px Arial";ctx.fillText("모든 몬스터 처치!",W/2,H/2-45);ctx.fillStyle="#fff";ctx.font="22px Arial";ctx.fillText(`Lv.${player.level}  ·  ${player.gold} Gold`,W/2,H/2+5)}
 else{ctx.fillStyle="#ff5252";ctx.font="bold 60px Arial";ctx.fillText("GAME OVER",W/2,H/2-30);ctx.fillStyle="#fff";ctx.font="20px Arial";ctx.fillText("ENTER를 눌러 다시 시작",W/2,H/2+25)}
 ctx.textAlign="left";
}
function resetGame(){
 Object.assign(player,{x:250,y:400,vx:0,vy:0,hp:100,maxHp:100,mp:50,maxMp:50,level:1,exp:0,nextExp:100,gold:0,potions:5});
 cameraX=0;gameOver=false;victory=false;monsters.splice(0);
 monsters.push(createMonster(600,510,"슬라임",35,15),createMonster(850,330,"슬라임",40,20),createMonster(1120,430,"버섯",50,25),createMonster(1500,400,"버섯",55,30),createMonster(1850,290,"고블린",70,40),createMonster(2200,400,"고블린",80,50));
}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();drawPlatforms();drawGoal();for(const m of monsters)drawMonster(m);drawPlayer();drawEffects();drawUI();drawOverlay()}
function gameLoop(){updatePlayer();updateMonsters();updateEffects();draw();requestAnimationFrame(gameLoop)}gameLoop();
</script>
</body>
</html>
